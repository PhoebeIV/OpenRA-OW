		Queue: Defense
		BuildPaletteOrder: 80
		Prerequisites: weap, ~structures.uac, ~techlevel.unrestricted
		Description: actor-plstur.description
	Valued:
		Cost: 1500
	Tooltip:
		Name: actor-plstur.name
	Health:
		HP: 60000
	Armor:
		Type: Heavy
	RevealsShroud:
		MinRange: 6c0
		Range: 8c0
		RevealGeneratedShroud: False
	RevealsShroud@GAPGEN:
		Range: 6c0
