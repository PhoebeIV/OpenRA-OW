covenantlich:
	Inherits: ^Vehicle
	Inherits@CARGOPIPS: ^CargoPips
	Inherits@selection: ^SelectableEconomicUnit
	-HitShape:
	HitShape: 
		TargetableOffsets: 0,0,1536
		Type: Circle
			Radius: 426
			VerticalTopOffset: 1600
			VerticalBottomOffset: 1400
	Buildable:
		Queue: Aircraft
		BuildAtProductionType: Helicopter
		BuildPaletteOrder: 1
		Prerequisites: ~aircraft.covenant
		Description: actor-covenantlich.description
	Valued: # 1200
		Cost: 400
	GivesExperienceMultiplier@value: 
		Modifier: 300
	ProductionCostMultiplier@value:
		Multiplier: 300
	Tooltip:
		Name: actor-covenantlich.name
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Health:
		HP: 40000
	Harvester:
		Resources: Ore,Gems,Tiberium,BlueTiberium,Oil
		BaleUnloadDelay: 3
		BaleLoadDelay: 9
		SearchFromProcRadius: 15
		SearchFromHarvesterRadius: 8
		EmptyCondition: no-ore
	WithHarvestOverlay:
		Sequence: collect
		LocalOffset: 0,0,0
	WithDockingOverlay:
		Sequence: deliver
	ChangesHealth:
		Step: 100
		Delay: 25
		StartIfBelow: 50
		DamageCooldown: 500
	RevealsShroud:
		MinRange: 6c0
		Range: 8c0
		Type: GroundPosition
		RevealGeneratedShroud: False
	RevealsShroud@GAPGEN:
		Range: 6c0
		Type: GroundPosition
	SpawnActorOnDeath:
		Actor: covenantlich.Husk
	Selectable:
		Bounds: 1706, 1536, 0,-1536
		DecorationBounds: 1706, 1536,0,-1536
	FireWarheadsOnDeath:
		RequiresCondition: !no-ore
		Weapon: OreExplosion
	Mobile:
		Speed: 96
		Locomotor: chinook
		Voice: Move
	WithStoresResourcesPipsDecoration:
		Position: BottomLeft
		RequiresSelection: true
		PipCount: 7
		ResourceSequences:
			Ore: pip-yellow
			Gems: pip-red
			Tiberium: pip-green
			BlueTiberium: pip-blue
			Oil: pip-oil
	Hovers:
		InitialHeight: 1536
	WithShadow:
		Offset: 43, 1536, 0
		ZOffset: -129
	Voiced:
		VoiceSet: CovenantElite
	GpsDot:
		String: Harvester
	Targetable:
		TargetTypes: Air, AirborneActor
	-Passenger:
	DockClientManager:
	StoresResources:
		Capacity: 20
		Resources: Ore,Gems,Tiberium,BlueTiberium,Oil
	GrantConditionOnPrerequisite@hatetib:
		Prerequisites: ai.hatetib
		Condition: ai.hatetib
	ProximityExternalCondition@hatetib:
		RequiresCondition: ai.hatetib
		Range: 8c0
		ValidRelationships: Neutral, Enemy
		Condition: makecreeps

