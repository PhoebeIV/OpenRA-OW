C10.Dr:
	Inherits: C10
	-GrantRandomCondition@dude:
	-KillsSelf@dude:
	-SpawnActorOnDeath@dude:
	-ScaredyCat:
	Tooltip:
		Name: actor-c10-dr-name
	Buildable:
		Prerequisites: ~disabled
		BuildPaletteOrder: 90000
		Queue: Infantry
		Icon: stand
	Valued:
		Cost: 800
	Health:
		HP: 20000
	Voiced:
		VoiceSet: Scientist2Voice
	RevealsShroud:
		Range: 8c0
	GrantTimedCondition:
		Condition: spawned
		Duration: 250
	AmbientSound:
		RequiresCondition: spawned
		SoundFiles: docmake.aud
		Delay: 10
		Interval: 5000
	AmbientSound@2:
		SoundFiles: docsit1.aud,docsit2.aud,docsit3.aud,docsit4.aud,docsit5.aud,docsit6.aud
		Delay: 250
		Interval: 30,400
	-Wanders:
	AttackWander:
		MinMoveDelay: 150
		MaxMoveDelay: 750
	Armament:
		Weapon: PortaTesla
		LocalOffset: 256,0,512
	AnnounceOnKill:
		Interval: 25
		Voice: Action
	Targetable@noauto:
		RequiresCondition: spawned
		TargetTypes: NoAutoTarget
	SpawnActorOnDeath:
		Actor: drfowlcrate

C10.Scot:
	Inherits: C10.Dr
	Tooltip:
		Name: actor-c10-scot-name
	Health:
		HP: 35000
	Mobile:
		Speed: 72
	Voiced:
		VoiceSet: ScotsmanVoice
	Armament:
		Weapon: DoomBerserkerFist
	AmbientSound:
		RequiresCondition: spawned
		SoundFiles: scotsman1.aud
		Delay: 10
		Interval: 5000
	AmbientSound@2:
		SoundFiles: scotsman2.aud,scotsman3.aud,scotsman4.aud,scotsman5.aud,scotsman6.aud,scotsman7.aud,scotsman8.aud,scotsman9.aud,scotsman10.aud,scotsman11.aud,scotsman12.aud,scotsman13.aud,scotsman14.aud,scotsman15.aud
		Delay: 34
		Interval: 30,400
	ConvertsDamageToHealth:
		DamagePercentConverted: 40
	AttackWander:
		WanderMoveRadius: 6
		MaxMoveDelay: 50
		MinMoveDelay: 25
	AutoTarget:
		ScanRadius: 48
		InitialStance: AttackAnything

C10.Mobius:
	Inherits: C10
	-GrantRandomCondition@dude:
	-KillsSelf@dude:
	-SpawnActorOnDeath@dude:
	-ScaredyCat:
	Tooltip:
		Name: actor-c10-mobius-name
	Buildable:
		Prerequisites: ~disabled
		BuildPaletteOrder: 90000
		Queue: Infantry
		Icon: stand
	Valued:
		Cost: 800
	Health:
		HP: 10000
	Voiced:
		VoiceSet: MobiusVoice
	RevealsShroud:
		Range: 8c0
	-Wanders:
	AttackWander:
		MinMoveDelay: 150
		MaxMoveDelay: 750
	SpawnActorOnDeath:
		Actor: drfowlcrate
	Armament:
		Weapon: VoltAutorifle
		LocalOffset: 256,0,512
		PauseOnCondition: !ammo
	Armament@GARRISONED:
		Name: garrisoned
		Weapon: VoltAutorifle
		MuzzleSequence: garrison-muzzle
	Armament@BUS:
		Name: bus
		Weapon: VoltAutorifle
		MuzzleSequence: garrison-muzzle
	AmmoPool:
		Ammo: 50
		AmmoCondition: ammo
	ReloadAmmoPool:
		Count: 50
		Sound: voltauto_reload.aud
		ResetOnFire: true
	AmmoPool@hack:
		InitialAmmo: 0
		Name: hackammo
	ReloadAmmoPool@hack:
		RequiresCondition: firing
		AmmoPool: hackammo
		Delay: 1
	GrantPeriodicCondition@randomiseattackspeed:
		ActiveDuration: 2,5
		CooldownDuration: 2,5
		Condition: attackspeed
		RequiresCondition: firing
	GrantConditionOnAttack@firing:
		Condition: firing
		RevokeDelay: 4
	ExplodeWeapon@endsound:
		Weapon: VoltAutorifleEnd
		AmmoPoolName: hackammo
		RequiresCondition: !firing
	ReloadDelayMultiplier@randomiseattackspeed:
		RequiresCondition: attackspeed
		Modifier: 150
	-ReloadDelayMultiplier@squadboost:
	-ReloadDelayMultiplier@RANK-1:
	-ReloadDelayMultiplier@RANK-2:
	-ReloadDelayMultiplier@RANK-3:
	-ReloadDelayMultiplier@RANK-ELITE:
	AutoTargetPriority@DEFAULT:
		RequiresCondition: !stance-attackanything
		ValidTargets: Infantry, Vehicle, Ship, Underwater, Defense, Mine, NoAutoTarget
		-InvalidTargets:

