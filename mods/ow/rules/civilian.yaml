#scientist
C10:
	Inherits@2: ^ArmedCivilian
	Buildable:
		Prerequisites: ~disabled
		BuildPaletteOrder: 90000
		Queue: Infantry
		Icon: stand
	GrantRandomCondition@dude:
		Conditions: x,x,x,x,x,x,mobius,dude,dude2
	GrantConditionOnPrerequisite@nodrdude:
		Prerequisites: environment.nodrspawn
		Condition: no_dr
	KillsSelf@dude:
		RequiresCondition: !no_dr && (dude || dude2)
		Delay: 25
	KillsSelf@mobius:
		RequiresCondition: mobius
		Delay: 25
	SpawnActorOnDeath@dude:
		RequiresCondition: !no_dr && dude
		Actor: C10.Dr
		OwnerType: InternalName
		InternalOwner: Creeps
		RequiresLobbyCreeps: true
	SpawnActorOnDeath@dude2:
		RequiresCondition: !no_dr && dude2
		Actor: C10.Scot
		OwnerType: InternalName
		InternalOwner: Creeps
		RequiresLobbyCreeps: true
	SpawnActorOnDeath@dude3:
		RequiresCondition: mobius
		Actor: C10.Mobius

EINSTEIN:
	GrantRandomCondition@dude:
		Conditions: x,x,x,x,x,x,x,x,x,x,x,x,x,rick
	KillsSelf@dude:
		RequiresCondition: rick
		Delay: 25
	SpawnActorOnDeath@dude:
		RequiresCondition: dude
		Actor: EINSTEIN.Rick
		OwnerType: InternalName
		InternalOwner: Neutral

