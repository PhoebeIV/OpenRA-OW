# --- 6. RandomDropPodsPower ---
# drops a tank in a pod within 15 cells of where you clicked
# pod flies in from the edge of the map and lands near the cursor
# grabbed from TCTRL in terran_add.yaml
#
# this version is fine with ground units in UnitTypes, no aircraft required
TEST.RANDDROP:
	Inherits: MSLF
	-NukePower:
	Tooltip:
		Name: "[TEST] Random Drop Pods"
	Buildable:
		Queue: Building
		Prerequisites: ~disabled
		BuildPaletteOrder: 9906
	RandomDropPodsPower:
		TargetMode: NearTarget      # lands within MaxRadius of the click
		MaxRadius: 15c0             # 15 cell radius
		Cursor: chrono-target
		Icon: orbitaldrop
		ChargeInterval: 50
		Name: "[TEST] Orbital Drop"
		OrderName: TestRandDrop
		UnitTypes: 2TNK             # what comes out (medium tank)
		Drops: 1,1                  # drop between 1 and 1 pods (just always 1)
		PodScatter: 1               # how spread the landing spots are
		PodFacing: 704              # facing of the pod when it opens
		EntryEffect: explosion      # effect when the pod enters the map
		EntryEffectSequence: ionring
		CameraActor: camera
		Weapon: TerranGoliath2      # explosion on landing
		WeaponDelay: 5              # slight delay before the landing explosion
		DisplayRadarPing: true
		SelectTargetSpeechNotification: SelectTarget
		SupportPowerPaletteOrder: 75


# --- 7. RandomDropPodsPowerOW ---
# OW version of drop pods, always lands 10 cells east of map center
# grabbed from TRAYNOR.Hero4 in hero_raynor.yaml
#
# WARNING: this version requires UnitTypes to be aircraft actors
# the pods fly in under their own power so they need Aircraft on them
# putting a ground unit like 2TNK here will crash the game when you place the building
# use the regular RandomDropPodsPower above if you want to drop ground units
TEST.RANDDROPOW:
	Inherits: MSLF
	-NukePower:
	Tooltip:
		Name: "[TEST] Random DropPodsOW"
	Buildable:
		Queue: Building
		Prerequisites: ~disabled
		BuildPaletteOrder: 9907
	RandomDropPodsPowerOW:
		TargetMode: CenterOffset    # always land at an offset from map center
		CenterOffset: 10,0          # 10 cells east (X,Y in cells)
		Cursor: chrono-target
		Icon: parabombs
		ChargeInterval: 50
		Name: "[TEST] Orbital Bombardment"
		OrderName: TestRandDropOW
		Drops: 2,2                  # always drop exactly 2
		PodScatter: 3
		PodFacing: 704
		UnitTypes: TSIEGE_SUPPORT1, TSIEGE_SUPPORT2  # aircraft pods -- dont swap these for ground units
		EntryEffect: explosion
		EntryEffectSequence: bunkerbustersring
		CameraActor: camera
		CameraRemoveDelay: 250
		Weapon: TerranGhostPainter  # landing explosion
		WeaponDelay: 5
		SelectTargetSpeechNotification: SelectTarget
		SupportPowerPaletteOrder: 76


