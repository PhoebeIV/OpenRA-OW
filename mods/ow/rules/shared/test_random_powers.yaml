# test buildings for the random support power traits
# all built off MSLF (missile silo) since it already has everything a building needs
# each one strips out MSLF's nuke and swaps in a different random power variant
# icons/weapons/sounds are all pulled from real actors in the mod so nothing should be missing
#
# only two things are changed from the originals:
#   OrderName     - has to be unique per player, test ones all start with Test
#   ChargeInterval - cranked way down so you dont sit there waiting forever
#
# to use: turn on cheats in lobby, build from construction yard like normal


# --- 1. RandomNukePower ---
# fires a nuke at a totally random spot on the map, ignores where you clicked
# grabbed the config from chinanuclearsilo in china_str.yaml
TEST.RANDNUKE:
	Inherits: MSLF              # steal all of MSLF's building traits so we dont have to redo them
	-NukePower:                 # strip the nuke that came with MSLF
	Tooltip:
		Name: "[TEST] Random Nuke"
	Buildable:
		Queue: Building
		Prerequisites: ~disabled    # cheat only
		BuildPaletteOrder: 9901
	RandomNukePower:
		TargetMode: RandomMap       # pick anywhere on the map, ignore the click
		PauseOnCondition: disabled
		Cursor: nuke
		Icon: nuclearmissile
		ChargeInterval: 50          # fast charge for testing
		Name: "[TEST] Nuclear Missile"
		OrderName: TestRandNuke     # has to be unique -- if you copy this actor change this first
		MissileWeapon: ChinaNuke
		MissileImage: atomic
		MissileDelay: 5
		SpawnOffset: 1c0,427,0      # where the missile comes out of the building
		DisplayTimerRelationships: Ally, Neutral, Enemy
		DisplayBeacon: True
		DisplayRadarPing: True
		BeaconPoster: chinanukebeacon
		CameraRange: 10c0
		ArrowSequence: arrow
		ClockSequence: clock
		CircleSequence: circles
		IncomingSpeechNotification: AbombLaunchDetected
		SupportPowerPaletteOrder: 70


# --- 2. RandomIonCannonPower (NearTarget) ---
# fires a lightning beam within 20 cells of wherever you clicked
# good for testing the radius mode
# grabbed from BIO.A in allies_str.yaml
#
# heads up: IonCannonPower is locked in the engine so we cant inherit its fields
# all the fields below had to be declared manually in the trait, thats why there are more of them
TEST.RANDION:
	Inherits: MSLF
	-NukePower:
	Tooltip:
		Name: "[TEST] Random Ion Cannon"
	Buildable:
		Queue: Building
		Prerequisites: ~disabled
		BuildPaletteOrder: 9902
	RandomIonCannonPower:
		TargetMode: NearTarget      # random within the radius of the click
		MaxRadius: 20c0             # lands somewhere within 20 cells of cursor
		PauseOnCondition: disabled
		Cursor: chrono-target
		Icon: weathericon
		ChargeInterval: 50
		Name: "[TEST] Lightning Storm"
		OrderName: TestRandIon
		Weapon: WeatherGrenade      # what actually does the damage
		WeaponDelay: 0              # damage and visual fire at the same time
		Effect: explosion           # sprite sheet with the beam animation on it
		EffectSequence: piff        # which animation from that sheet to play
		EffectPalette: effect
		OnFireSound: thunder-ambient.aud
		DisplayRadarPing: True
		DisplayTimerRelationships: Ally, Neutral, Enemy
		BeginChargeSpeechNotification: IonCannonCharge
		EndChargeSpeechNotification: IonCannonReady
		SelectTargetSpeechNotification: DawnSelectTarget
		SupportPowerPaletteOrder: 19


# --- 3. RandomAirstrikePower ---
# sends 3 bombers to a random spot on the map
# UseDirectionalTarget is on so you can still drag a direction, but the landing spot is random anyway
# grabbed from DOME in shared_str.yaml
TEST.RANDAIR:
	Inherits: MSLF
	-NukePower:
	Tooltip:
		Name: "[TEST] Random Airstrike"
	Buildable:
		Queue: Building
		Prerequisites: ~disabled
		BuildPaletteOrder: 9903
	RandomAirstrikePower:
		TargetMode: RandomMap
		Cursor: chrono-target
		Icon: parabombs
		ChargeInterval: 50
		Name: "[TEST] Carpet Bomb"
		OrderName: TestRandAir
		UnitType: do17.bomber       # the plane that flies in
		SquadSize: 3                # 3 planes
		SquadOffset: 1792,1792,0    # how far apart they fly from each other
		QuantizedFacings: 8         # 8 possible approach angles
		UseDirectionalTarget: True  # drag to pick approach direction
		DirectionArrowAnimation: paradirection
		DisplayBeacon: true
		BeaconPoster: pbmbicon
		ArrowSequence: arrow
		ClockSequence: clock
		CircleSequence: circles
		CameraActor: camera
		CameraRemoveDelay: 150      # how long before the camera snaps back
		SelectTargetSpeechNotification: SelectTarget
		SupportPowerPaletteOrder: 40


# --- 4. RandomParatroopersPower ---
# drops 3 medium tanks from a covenant spirit dropship at a random map location
# grabbed from covenanttheeye in covenant_str.yaml
TEST.RANDPARA:
	Inherits: MSLF
	-NukePower:
	Tooltip:
		Name: "[TEST] Random Paradrop"
	Buildable:
		Queue: Building
		Prerequisites: ~disabled
		BuildPaletteOrder: 9904
	RandomParatroopersPower:
		TargetMode: RandomMap
		Cursor: chrono-target
		Icon: paratroopers
		ChargeInterval: 50
		Name: "[TEST] Covenant Spirit Drop"
		OrderName: TestRandPara
		UnitType: covenantspirit    # the carrier plane, not what gets dropped
		DropItems: 2TNK, 2TNK, 2TNK # what actually lands (3 medium tanks)
