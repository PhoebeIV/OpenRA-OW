# --- 9. DelayedPowerTrigger ---
# fires a nuke automatically on a random timer, no player input needed at all
# place the building and just watch it go
#
# how this works:
# RandomNukePower is set up normally with a short charge time
# DelayedPowerTrigger sits alongside it and fires it once its charged
# PowerOrderName has to match OrderName exactly or nothing fires
#
# set Repeat: false for one shot, set DelayMin and DelayMax to the same number for a fixed wait
TEST.AUTONUKE:
	Inherits: MSLF
	-NukePower:
	Tooltip:
		Name: "[TEST] Auto Nuke (DelayedTrigger)"
	Buildable:
		Queue: Building
		Prerequisites: ~disabled
		BuildPaletteOrder: 9909
	RandomNukePower:
		TargetMode: RandomMap
		PauseOnCondition: disabled
		Cursor: nuke
		Icon: nuclearmissile
		ChargeInterval: 100         # slightly longer than 50 so you can see the delay working
		Name: "[TEST] Auto Nuclear Missile"
		OrderName: AutoTestNuke     # DelayedPowerTrigger below needs to match this exactly
		MissileWeapon: ChinaNuke
		MissileImage: atomic
		MissileDelay: 5
		SpawnOffset: 1c0,427,0
		DisplayTimerRelationships: Ally, Neutral, Enemy
		DisplayBeacon: True
		DisplayRadarPing: True
		BeaconPoster: chinanukebeacon
		CameraRange: 10c0
		ArrowSequence: arrow
		ClockSequence: clock
		CircleSequence: circles
		IncomingSpeechNotification: AbombLaunchDetected
		SupportPowerPaletteOrder: 78
	DelayedPowerTrigger:
		PowerOrderName: AutoTestNuke  # has to match OrderName above exactly
		DelayMin: 150               # shortest possible wait in ticks
		DelayMax: 400               # longest possible wait, picks random between these two
		Repeat: true                # keep firing forever
