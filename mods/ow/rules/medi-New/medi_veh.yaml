##Inherit for Horse units, makes the targetable as infantry.
^Horse:
	Mobile:
		TurnSpeed: 160
		Speed: 160
		Locomotor: wheeled
	Armor:
		Type: Light

^MediSiege:
	Mobile:
		TurnSpeed: 12
		Speed: 60
		Locomotor: heavywheeled
	Armor:
		Type: Light
	Power:
		Amount: 0

^Medibeast:
	Inherits: ^Vehicle
	Mobile:
		TurnSpeed: 160
		Speed: 100
		Locomotor: foot
	Power:
		Amount: -30
	GrantConditionOnPrerequisite@blackblood:
		Prerequisites: upgrade.mediblackblood
		Condition: blackblood
	ChangesHealth@blackblood:
		PercentageStep: 1
		Delay: 25
		StartIfBelow: 100
		DamageCooldown: 150
		RequiresCondition: blackblood && !corrode
	ExternalCondition@stunned:
		Condition: stunned
	SpeedMultiplier@stunned:
		RequiresCondition: stunned
		Modifier: 0

^MediDog:
	Power:
		Amount: -30
	GrantConditionOnPrerequisite@blackblood:
		Prerequisites: upgrade.mediblackblood
		Condition: blackblood
	ChangesHealth@blackblood:
		PercentageStep: 1
		Delay: 25
		StartIfBelow: 100
		DamageCooldown: 150
		RequiresCondition: blackblood && !corrode
	ExternalCondition@stunned:
		Condition: stunned
	SpeedMultiplier@stunned:
		RequiresCondition: stunned
		Modifier: 0
