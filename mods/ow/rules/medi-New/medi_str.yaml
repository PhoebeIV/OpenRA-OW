##Main MCV Building
mediconyard:
	Inherits: FACTD
	-WithIdleOverlay@soviet:
	-SpawnActorsOnSell:
	Valued:
		Cost: 2000
	Tooltip:
		Name: Mediaval conyard
	BaseBuilding:
	Transforms:
		RequiresCondition: factundeploy && !bot_undeploy_block
		PauseOnCondition: chrono-vortex || being-captured || being-demolished || build-incomplete
		IntoActor: mcvm
	TransformsIntoMobile:
		RequiresCondition: factundeploy && !bot_undeploy_block
		Locomotor: heavywheeled
		RequiresForceMove: true
	TransformsIntoPassenger:
		RequiresCondition: factundeploy && !bot_undeploy_block
		CargoType: Vehicle
		RequiresForceMove: true
	TransformsIntoRepairable:
		RequiresCondition: factundeploy && !bot_undeploy_block
		RepairActors: fix
		RequiresForceMove: true
	TransformsIntoTransforms:
		RequiresCondition: factundeploy && build-incomplete && !bot_undeploy_block
	Sellable:
		RequiresCondition: !build-incomplete && !chrono-vortex && !being-captured && !being-demolished
	Power:
		Amount: 0
	ProvidesPrerequisite@buildingname:
	ProvidesPrerequisite@medi:
		Prerequisite: structures.medi
	ProvidesPrerequisite@mediwizards:
		Prerequisite: structures.mediwizards
		Factions: mediwizards
	ProvidesPrerequisite@medicult:
		Prerequisite: structures.medicult
		Factions: medicult
	ProvidesPrerequisite@mediholy:
		Prerequisite: structures.mediholy
		Factions: mediholy
	RenderSprites:
		Image: factm
		PlayerPalette: player

##foundrymed
foundrymedi:
	Inherits: FOUNDRY
