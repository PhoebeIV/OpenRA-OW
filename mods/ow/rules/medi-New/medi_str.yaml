
###############################################################################
##################################   Buildings   ##############################
###############################################################################

^TaxGen:
	Inherits: MINE_DUMMY
	-Interactable:
	-Targetable:
	ExternalCondition@anchor:
		Condition: tax-anchor
	KillsSelf:
		RequiresCondition: !tax-anchor
		Delay: 25
	FireWarheadsOnDeath@tribute:
		Type: CenterPosition
		Weapon: TributeCleanup
		EmptyWeapon: TributeCleanup

taxgen.low:
	Inherits: ^TaxGen
	SeedsResource:
		ResourceType: TributeLow
		Interval: 400
		MaxRange: 6

taxgen.mid:
	Inherits: ^TaxGen
	SeedsResource:
		ResourceType: TributeMid
		Interval: 500
		MaxRange: 6

taxgen.high:
	Inherits: ^TaxGen
	SeedsResource:
		ResourceType: TributeHigh
		Interval: 600
		MaxRange: 6

taxgen.super:
	Inherits: ^TaxGen
	SeedsResource:
		ResourceType: TributeSuper
		Interval: 750
		MaxRange: 6

^TaxableBase:
	ProximityExternalCondition@taxgen:
		Condition: tax-anchor
		Range: 2c0
		AffectsParent: false

^TaxableLow:
	Inherits@tax: ^TaxableBase
	FreeActor@tribute:
		Actor: taxgen.low
		SpawnOffset: 0,0
	Power:
		Amount: -50

^TaxableMid:
	Inherits@tax: ^TaxableBase
	FreeActor@tribute:
		Actor: taxgen.mid
		SpawnOffset: 0,0
	Power:
		Amount: -100

^TaxableHigh:
	Inherits@tax: ^TaxableBase
	FreeActor@tribute:
		Actor: taxgen.high
		SpawnOffset: 0,0
	Power:
		Amount: -200

^TaxableSuper:
	Inherits@tax: ^TaxableBase
	FreeActor@tribute:
		Actor: taxgen.super
		SpawnOffset: 0,0
	Power:
		Amount: -400


