##starting harvester
##medislave
mediSLAVE:
	Inherits@gharve: GHARV
	Inherits@PowerTier: ^MediPowerTier1
	-SpeedMultiplier@shoes:
	Buildable:
		IconPalette: tsunit
		Queue: Infantry
		BuildAtProductionType: Soldier
		Prerequisites: ~infantry.medi, ~!upgrade.mediabolish, ~!infantry.medicult
		Description: actor-medislave.description
		BuildPaletteOrder: 403
		BuildDuration: 400
	Valued:
		Cost: 50
	Tooltip:
		Name: actor-medislave.name
	Mobile:
		Speed: 40
		Locomotor: foot
	Health:
		HP: 3000
	Harvester:
		Capacity: 10
	Voiced:
		VoiceSet: SlaveVoice
	Armament:
		Weapon: RepairWorker
		Cursor: repair
		OutsideRangeCursor: repair
		TargetRelationships: Ally
		ForceTargetRelationships: None
	TakeCover:
		SpeedModifier: 140
		Duration: 75
		DamageTriggers: TriggerProne
	ChangesHealth@tiberium:
		RequiresCondition: standing_in_tiberium && shielded && !gdi_suits && !shoes
		Step: -1000
	ChangesHealth@tiberium_noshield:
		RequiresCondition: standing_in_tiberium && !shielded && !gdi_suits && !shoes
		Step: -40
	Targetable@harvester:
		TargetTypes: TiberiumImmune
	RenderSprites:
		Image: mslave
	WithStoresResourcesPipsDecoration:
		Position: BottomLeft
		RequiresSelection: true
		PipCount: 1
	DockClientManager:
	StoresResources:
		Capacity: 5
	GrantConditionOnPrerequisite@mediworkboot:
		Prerequisites: upgrade.mediworkerboots
		Condition: shoes
	GrantConditionOnPrerequisite@slavedrive:
		Prerequisites: upgrade.medislavedrive
		Condition: slavedrive
	StoresResources@slavedrive:
		Capacity: 5
		Resources: Ore, Gems, Tiberium, BlueTiberium
		RequiresCondition: slavedrive

