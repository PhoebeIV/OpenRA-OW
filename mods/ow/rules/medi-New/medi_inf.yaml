
###############################################################################
###############################  Inherits    ##################################
###############################################################################

^MediLowPower:
	GrantConditionOnPowerState@LOWPOWER:
		Condition: lowpower
		ValidPowerStates: Low, Critical

^TSMedi:
	WithInfantryBody:
		IdleSequences: idle1, idle2
	WithDeathAnimation:
		DeathSequencePalette: tsunit
		CrushedSequencePalette: tsunit

^MediSoldier:
	Inherits@Infantry: ^Infantry
	ExternalCondition@stunned:
		Condition: stunned
	SpeedMultiplier@stunned:
		RequiresCondition: stunned
		Modifier: 0
	UpdatesPlayerStatistics:
	MustBeDestroyed:
	ProximityCaptor:
		Types: Infantry
	WithInfantryBody:
		IdleSequences: idle1
		StandSequences: stand
	AttackFrontal:
		FacingTolerance: 0
	Selectable:
		Bounds: 768, 938, 0, -469
		DecorationBounds: 682, 938, 0, -469
	WithDeathAnimation:
		DeathTypes:
			DefaultDeath: 1
			BulletDeath: 1
			SmallExplosionDeath: 1
			ExplosionDeath: 4
	TakeCover:
		SpeedModifier: 140
		Duration: 75
		DamageTriggers: TriggerProne

^MediPowerTier0:
	Power:
		Amount: 0

^MediPowerTier1:
	Power:
		Amount: 50

^MediPowerTier2:
	Power:
		Amount: 75

^MediPowerTier3:
	Power:
		Amount: 100

^MediPowerTier4:
	Power:
		Amount: 150

^Wizards:
	Inherits@MediSoldier: ^MediSoldier
	Inherits@PowerTier: ^MediPowerTier3
	-GrantConditionOnPrerequisite@medimagicwep:
	##magic units get bonus damage
	GrantConditionOnPrerequisite@medipure:
		Prerequisites: upgrade.medipuremagic
		Condition: medipure
	FirepowerMultiplier@medipure:
		RequiresCondition: medipure
		Modifier: 125
	GrantConditionOnPrerequisite@magearmor:
		Prerequisites: upgrade.medimagearmor
		Condition: medimagearmor
	DamageMultiplier@magearmor:
		RequiresCondition: medimagearmor
		Modifier: 70
	GrantConditionOnPrerequisite@mediwiztow:
		Prerequisites: upgrade.mediwizardtower
		Condition: mediwiztow

^Undead:
	FirepowerMultiplier@undead:
		Modifier: 120
		RequiresCondition: Necromancy
	GrantConditionOnPrerequisite@Necromancy:
		Prerequisites: upgrade.medinecromancy
		Condition: Necromancy

