	Pluggable@PowerCore:
		Offset: 0,0
		Conditions:
			power.airstrike: power-airstrike
			power.curse: power-curse
			power.holylight: power-holylight
			power.golem: power-golem
			power.smite: power-smite
			power.toxiccloud: power-toxiccloud
			power.pillars: power-pillars
			power.undead: power-undead
			power.darkness: power-darkness
