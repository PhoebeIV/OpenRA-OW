			power.chaosstorm: power-chaosstorm
			power.chains: power-chains
			power.sanctuary: power-sanctuary
			power.petrify: power-petrify
			power.frostnova: power-frostnova
			power.icespike: power-icespike
			power.chainlightning: power-chainlightning
			power.zombierain: power-zombierain
			power.transholy: power-transholy
			power.transwiz: power-transwiz
		Requirements:
			power.airstrike: !power-active
			power.curse: !power-active
			power.holylight: !power-active
			power.golem: !power-active
			power.smite: !power-active
			power.toxiccloud: !power-active
			power.pillars: !power-active
			power.undead: !power-active
			power.darkness: !power-active
			power.soulharvest: !power-active
			power.chaosstorm: !power-active
			power.chains: !power-active
			power.sanctuary: !power-active
			power.petrify: !power-active
			power.frostnova: !power-active
			power.icespike: !power-active
			power.chainlightning: !power-active
			power.zombierain: !power-active
			power.transholy: !power-active
			power.transwiz: !power-active
		EditorOptions:
			power.airstrike: Dragon Strike
			power.curse: Curse
			power.holylight: Holy Light
			power.golem: Rock Golem
			power.smite: Smite
			power.toxiccloud: Toxic Cloud
			power.pillars: Pillars of Fire
			power.undead: Undead Magic
			power.darkness: Invisibility
			power.soulharvest: Soul Harvest
			power.chaosstorm: Chaos Storm
			power.chains: Chains of Heaven
			power.sanctuary: Sanctuary
			power.petrify: Petrify
			power.frostnova: Frost Nova
			power.icespike: Ice Spike Barrage
			power.chainlightning: Chain Lightning
			power.zombierain: Zombie Rain
			power.transholy: Holy Transmute
			power.transwiz: Transmute
	GrantCondition@PowerActive:
		RequiresCondition: power-airstrike || power-curse || power-holylight || power-golem || power-smite || power-toxiccloud || power-pillars || power-undead || power-darkness || power-soulharvest || power-chaosstorm || power-chains || power-sanctuary || power-petrify || power-frostnova || power-icespike || power-chainlightning || power-zombierain || power-transholy || power-transwiz
		Condition: power-active
	Pluggable@PowerT2:
		Offset: 0,1
		Conditions:
			power.t2: power-t2
		Requirements:
			power.t2: power-active && !power-t2
		EditorOptions:
			power.t2: Power Amplifier I
	Pluggable@PowerT2b:
		Offset: 0,2
		Conditions:
			power.t2: power-t2b
		Requirements:
			power.t2: power-active && power-t2 && !power-t2b
		EditorOptions:
			power.t2: Power Amplifier II
	Pluggable@PowerT2c:
