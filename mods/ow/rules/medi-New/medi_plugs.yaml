##############################################################################
## The Eye - Power Plugs
## One plug per support power. Each plugged power grants its own power-X
## condition, and GrantCondition@PowerActive ORs all of those into a single
## power-active condition. Pluggable@PowerCore.Requirements then just checks
## !power-active, enforcing a single active power without repeating a long
## expression for every plug type.
##
## EYE.T2UPGRADE is a universal stacking plug: it requires power-active
## (i.e. some power is already plugged in) and grants power-t2. The Greater
## Curse plug is the worked example - IonCannonPower@CursePowerGreater
## requires power-curse && power-t2 and replaces the base Curse power with a
## faster-recharging version. Other powers can gain their own "Greater"
## variant the same way, gated on their power-X && power-t2.
##############################################################################
EYE.AIRSTRIKE:
	Inherits: ^BuildingPlug
	Valued:
		Cost: 750
	Tooltip:
		Name: actor-eye-airstrike.name
	Buildable:
		Queue: EyePlugs
		Prerequisites: ~structures.medi, Vehicles.medi, ~!ai.hard, ~techlevel.infonly
		Description: actor-eye-airstrike.description
		Icon: medidragonstrikeicon
