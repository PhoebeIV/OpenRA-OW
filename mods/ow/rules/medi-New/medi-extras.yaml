## Zombie Rain pods - dropped by DropPodsPowerOW, falls to earth, explodes, spawns undead
zombierainpod:
	Inherits: tomahawkstormpower
	GrantRandomCondition@undead:
		Conditions: spawn-zombie, spawn-skeleton
	SpawnActorOnDeath@zombie:
		Actor: SummonedZombie
		RequiresCondition: spawn-zombie
	SpawnActorOnDeath@skeleton:
		Actor: Skeleton
		RequiresCondition: spawn-skeleton
	FallsToEarth:
		Explosion: ZombieRainExplosion
		Moves: true
		Velocity: 150
		MaximumSpinSpeed: 0
	Armament:
		Weapon: ZombieRainExplosion
	RenderSprites:
		Image: mzombie
	-BodyOrientation:
	ClassicFacingBodyOrientation:
		QuantizedFacings: 8
	WithSpriteBody:
		Sequence: run

zombierainpod1:
	Inherits: zombierainpod
	FallsToEarth:
		Explosion: ZombieRainExplosion
		Moves: true
		Velocity: 170
		MaximumSpinSpeed: 0

zombierainpod2:
	Inherits: zombierainpod
