## Invisible marker placed at each void laser impact; rises undead after a random delay
VoidRiseMarker:
	Inherits: MINE_DUMMY
	Immobile:
		OccupiesSpace: false
	BodyOrientation:
		QuantizedFacings: 0
	HitShape:
	Health:
		HP: 999999
	GrantRandomCondition:
		Conditions: spawn-nothing, spawn-zombie, spawn-skeleton
	GrantDelayedCondition:
		Condition: rise-time
		Delay: 500, 5000
	SpawnActorOnDeath@zombie:
		Actor: SummonedZombie
		RequiresCondition: spawn-zombie
	SpawnActorOnDeath@skeleton:
		Actor: Skeleton
		RequiresCondition: spawn-skeleton
	KillsSelf:
		RequiresCondition: rise-time

## Invisible marker scattered by Chaos Storm; detonates with a random elemental effect after a short fuse
ChaosStormMarker:
	Inherits: MINE_DUMMY
	Immobile:
		OccupiesSpace: false
	BodyOrientation:
		QuantizedFacings: 0
	HitShape:
	Health:
		HP: 999999
	GrantRandomCondition:
		Conditions: chaos-fire, chaos-lightning, chaos-curse, chaos-heal, chaos-smite, chaos-chill
	GrantDelayedCondition:
		Condition: detonate-time
		Delay: 50, 250
	FireWarheadsOnDeath@fire:
		Weapon: ChaosStormFireImpact
		RequiresCondition: chaos-fire
	FireWarheadsOnDeath@lightning:
		Weapon: ChaosStormLightningImpact
		RequiresCondition: chaos-lightning
	FireWarheadsOnDeath@curse:
		Weapon: ChaosStormCurseImpact
		RequiresCondition: chaos-curse
	FireWarheadsOnDeath@heal:
		Weapon: ChaosStormhealImpact
		RequiresCondition: chaos-heal
	FireWarheadsOnDeath@smite:
		Weapon: ChaosStormsmiteImpact
		RequiresCondition: chaos-smite
	FireWarheadsOnDeath@chill:
		Weapon: ChaosStormchillImpact
		RequiresCondition: chaos-chill
	KillsSelf:
		RequiresCondition: detonate-time

^TransmuteProbe:
	Inherits: MINE_DUMMY
	-Interactable:
	-Targetable:

TransmuteProbeHoly:
	Inherits: ^TransmuteProbe
	GrantConditionOnTerrain@resource:
		Condition: on-resource
		TerrainTypes: Ore, Tiberium, BlueTiberium
	KillsSelf@notore:
		RequiresCondition: !on-resource
		Delay: 3
		RemoveInstead: true
	KillsSelf@convert:
		RequiresCondition: on-resource
		Delay: 50
	FireWarheadsOnDeath@transmute:
		Type: CenterPosition
		Weapon: TransmuteConvertHoly
		EmptyWeapon: TransmuteConvertHoly

TransmuteProbeWizard:
	Inherits: ^TransmuteProbe
	GrantConditionOnTerrain@resource:
		Condition: on-resource
		TerrainTypes: Ore
	KillsSelf@notore:
		RequiresCondition: !on-resource
		Delay: 3
		RemoveInstead: true
	KillsSelf@convert:
		RequiresCondition: on-resource
		Delay: 50
	FireWarheadsOnDeath@transmute:
		Type: CenterPosition
		Weapon: TransmuteConvertWizard
		EmptyWeapon: TransmuteConvertWizard

