
## Meteor Storm pods
## Fireballs: large AOE, strong vs units, weak vs buildings
## Meteors: building damage only, no unit AOE
meteorstorm_fire:
	Inherits: tomahawkstormpower
	FallsToEarth:
		Explosion: MeteorStormFireball
		Moves: true
		Velocity: 160
		MaximumSpinSpeed: 0
	Armament:
		Weapon: MeteorStormFireball
	RenderSprites:
		Image: napalm3
	WithSpriteBody:
		Sequence: idle

meteorstorm_fire1:
	Inherits: meteorstorm_fire
	FallsToEarth:
		Explosion: MeteorStormFireball
		Moves: true
		Velocity: 180
		MaximumSpinSpeed: 0

meteorstorm_fire2:
	Inherits: meteorstorm_fire
