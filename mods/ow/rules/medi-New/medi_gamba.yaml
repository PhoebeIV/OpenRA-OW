###############################################################################
###################################  Gamba   ##################################
###############################################################################

##Gambling House - capturable by any infantry
gamblinghall:
	Inherits: ^PlayableCivBuilding
	Inherits@tax: ^TaxableLow
	-SpawnActorsOnSell:
	Valued:
		Cost: 3000
	Tooltip:
		Name: Gambling House
	Building:
		Footprint: == ==
		Dimensions: 2,2
		BuildSounds: medibuild1.aud, medibuildjobdone1.aud, medibuildplace1.aud
	Selectable:
		Bounds: 2048, 2048
		DecorationBounds: 2048, 2048
	Power:
		Amount: -100
	Health:
		HP: 20000
	Armor:
		Type: Wood
	Capturable:
		ValidRelationships: Enemy, Neutral, Ally
		Types: gamba
	CaptureManager:
		BeingCapturedCondition: being-captured
	RallyPoint:
	ProductionQueue@GamblingCode:
		Type: GamblingCode
		Group: GamblingCode
		DisplayOrder: 1
		LowPowerModifier: 100
		BuildDurationModifier: 100
	Exit:
		SpawnOffset: 0,1024,0
		ExitCell: 0,1
	ProvidesPrerequisite@buildingname:
	ProvidesPrerequisite@gamba:
		Prerequisite: gamblinghall
	RenderSprites:
		Image: gamblinghall

##Buildable gambling tokens
GamblingCodeT1:
	Inherits@gamba: ^GamblingCodeT1
	Inherits@dummy: MINE_DUMMY
	-Interactable:
	-Targetable:
	Buildable:
		Queue: GamblingCode
		Prerequisites: gamblinghall
		BuildPaletteOrder: 1
		Description: Risky Bet. High variance - big jackpot chance but most rolls pay little.
	Valued:
		Cost: 5000
	Tooltip:
		Name: Risky Bet

GamblingCodeT2:
	Inherits@gamba: ^GamblingCodeT2
	Inherits@dummy: MINE_DUMMY
	-Interactable:
	-Targetable:
	Buildable:
		Queue: GamblingCode
		Prerequisites: gamblinghall
		BuildPaletteOrder: 2
		Description: Standard Bet. Moderate risk, moderate rewards across the board.
	Valued:
		Cost: 10000
	Tooltip:
		Name: Standard Bet

GamblingCodeT3:
	Inherits@gamba: ^GamblingCodeT3
	Inherits@dummy: MINE_DUMMY
	-Interactable:
	-Targetable:
	Buildable:
		Queue: GamblingCode
		Prerequisites: gamblinghall
		BuildPaletteOrder: 3
		Description: Safe Bet. Lower jackpot ceiling but strong guaranteed minimums.
	Valued:
		Cost: 20000
	Tooltip:
		Name: Safe Bet

GamblingCodeT4:
	Inherits@gamba: ^GamblingCodeT4
	Inherits@dummy: MINE_DUMMY
	-Interactable:
	-Targetable:
	Buildable:
		Queue: GamblingCode
		Prerequisites: gamblinghall
		BuildPaletteOrder: 4
		Description: Outlier Bet. Pay 15000 for a shot at 65000 - or walk away with nothing.
	Valued:
		Cost: 15000
	Tooltip:
		Name: Outlier Bet

