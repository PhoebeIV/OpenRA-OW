## Transport Ship
mcanoe:
	Inherits: ^Ship
	Inherits@CARGOPIPS: ^CargoPips
	Buildable:
		Queue: Ship
		BuildAtProductionType: Boat
		BuildPaletteOrder: 10
		Prerequisites: ~ships.medi, ~!techlevel.noboats
		Description: General-purpose naval transport.\nCan carry infantry and tanks.\n  Unarmed when unloaded
	Valued:
		Cost: 700
	Tooltip:
		Name: Canoe
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	WithMoveAnimation:
		MoveSequence: run
	Health:
		HP: 30000
	Armor:
		Type: Heavy
	Mobile:
		Locomotor: lcraft
		Speed: 113
		PauseOnCondition: notmobile
	RevealsShroud:
		MinRange: 5c0
		Range: 6c0
		RevealGeneratedShroud: False
	RevealsShroud@GAPGEN:
		Range: 5c0
	SelectionDecorations:
	WithLandingCraftAnimation:
		OpenTerrainTypes: Clear, Rough, Road, Ore, Gems, Beach
	Cargo:
		Types: Infantry, Vehicle
		MaxWeight: 5
		PassengerFacing: 0
		LoadingCondition: notmobile
	AttackGarrisoned:
		Armaments: bus
		PortOffsets: 384,0,128, 224,-341,128, -224,-341,128, -384,0,128, -224,341,128, 224,341,128
		PortYaws: 0, 176, 341, 512, 682, 853
		PortCones: 88, 88, 88, 88, 88, 88
	ClassicFacingBodyOrientation:
		QuantizedFacings: 32
	-BodyOrientation:
	AttackFrontal:
		FacingTolerance: 0
	-Chronoshiftable:
	Selectable:
		DecorationBounds: 1536, 1536
	RenderSprites:
		Image: medicanoe
	WithCargoPipsDecoration:
		Position: BottomLeft
		RequiresSelection: true

##Anti Infantry Long range.
MBalistaboat:
	Inherits: ^Ship
	Inherits@AUTOTARGET: ^AutoTargetAllAssaultMove
	Buildable:
		Queue: Ship
		BuildAtProductionType: Boat
		BuildPaletteOrder: 40
		Prerequisites: ~ships.medi, ~!techlevel.noboats
		Description: Fast arrow artillery ship.\nCan detect submarines.\n  Strong vs Subs, Infantry\n  Weak vs anything else
	Valued:
		Cost: 1000
	Tooltip:
		Name: Hwacha Boat
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Health:
		HP: 30000
	Armor:
		Type: Heavy
	Mobile:
		TurnSpeed: 40
		Speed: 90
	RevealsShroud:
		MinRange: 5c0
		Range: 6c0
		RevealGeneratedShroud: False
	RevealsShroud@GAPGEN:
		Range: 5c0
	Turreted:
		TurnSpeed: 40
		Offset: 469,0,128
	Armament@PRIMARY:
		Weapon: medibattleballista
		LocalOffset: 0,-100,0, 0,100,0
		LocalYaw: 64, -64
	Armament@SECONDARY:
		Name: secondary
		Weapon: DepthCharge
		MuzzleSequence: muzzle
	AttackTurreted:
	SelectionDecorations:
	DetectCloaked:
		DetectionTypes: Underwater
		Range: 8c0
	RenderDetectionCircle:
	Selectable:
		DecorationBounds: 1621, 1621
	RenderSprites:
		Image: medibalistaboat

