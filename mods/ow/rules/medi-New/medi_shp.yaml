##General purpose attack boat, Strong for Air or Subs.
marcaneboat:
	Inherits: ^Ship
	Inherits@MediLowPower: ^MediLowPower
	Inherits@AUTOTARGET: ^AutoTargetAllAssaultMove
	Buildable:
		Queue: Ship
		BuildAtProductionType: Boat
		BuildPaletteOrder: 40
		Prerequisites: ~ships.medi, ~!techlevel.noboats
		Description: Ship with a Arcane Tower built onto it.\n  Strong vs Close range.
	Valued:
		Cost: 1500
	Tooltip:
		Name: Arcane Boat
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Health:
		HP: 50000
	Armor:
		Type: Heavy
	Mobile:
		TurnSpeed: 40
		Speed: 80
	RevealsShroud:
		MinRange: 5c0
		Range: 6c0
		RevealGeneratedShroud: False
	RevealsShroud@GAPGEN:
		Range: 5c0
	Turreted:
		TurnSpeed: 40
		Offset: 469,0,128
	Armament@PRIMARY:
		Weapon: ArcaneZapboat
		RequiresCondition: !lowpower
	Armament@SECONDARY:
		Name: secondary
		Weapon: ArcaneZapboatair
		RequiresCondition: !lowpower
	AttackTurreted:
	SelectionDecorations:
	DetectCloaked@u:
		DetectionTypes: Underwater
		Range: 8c0
	RenderDetectionCircle:
	Selectable:
		DecorationBounds: 1621, 1621
	RenderSprites:
		Image: mediarcaneboat
	Rearmable:
		RearmActors: gspen, spen, syrd, dockmedi
	AmmoPool:
		Ammo: 4
		RearmSound: minelay1.aud
		ReloadCount: 4
		ReloadDelay: 375
		Armaments:
	Minelayer:
		Mine: SEAMINE
	DetectCloaked:
		Range: 5c0
		DetectionTypes: Mine
		RequiresCondition: !lowpower
	WithAmmoPipsDecoration:
		Position: BottomLeft
		RequiresSelection: true

###############################################################################
################################## Test Spawner ################################
###############################################################################

MediShipTest:
	Inherits: barrackswg
	Buildable:
		IconPalette: tsunit
		Queue: Building
		Prerequisites: ~structures.medi
		Description: Spawns all medi ships for testing - place at water edge
		BuildPaletteOrder: 9999
		BuildDuration: 1
	Valued:
		Cost: 0
	Tooltip:
		Name: Ship Test Spawner
	KillsSelf:
		Delay: 5
		RemoveInstead: true
	## Row 0 (y=0)
	FreeActor@s01:
		Actor: mcanoe
		SpawnOffset: 0,0
	FreeActor@s02:
		Actor: MBalistaboat
		SpawnOffset: 3,0
	FreeActor@s03:
		Actor: mmanofwar
		SpawnOffset: 6,0
	FreeActor@s04:
		Actor: marcaneboat
		SpawnOffset: 9,0
