##Archer Tower T1 (2nd Archer)
##tower1up
upgrade.mediarrow:
	Inherits: ^UpgradeBaseExt
	Tooltip:
		Name: actor-upgrade-mediarrow.name
	Buildable:
		IconPalette: tsunit
		Description: actor-upgrade-mediarrow.description
		BuildPaletteOrder: 10007
		BuildDuration: 1000
		Prerequisites: ~structures.medi, ~!upgrade.mediarrow, ~techcenter
	ProductionCostMultiplier@upgrade:
		Multiplier: 2000
	ProvidesPrerequisite@upgradename:
	ExternalCondition@PRODUCED:
		Condition: produced

