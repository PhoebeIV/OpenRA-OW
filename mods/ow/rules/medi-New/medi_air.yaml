##anti armor flying tank
##dragon
MediDragon:
	Inherits: ^Plane
	Inherits@MediLowPower: ^MediLowPower
	Inherits@AUTOTARGET: ^AutoTargetAllAssaultMove
	Power:
		Amount: -25
	SpeedMultiplier@lowpower:
		RequiresCondition: lowpower
		Modifier: 70
	Buildable:
		Queue: Aircraft
		BuildAtProductionType: Helicopter
		BuildPaletteOrder: 65
		Prerequisites: ~aircraft.mediwizards
		BuildLimit: 4
		Description: Airborn Fighter of the Medieval era, \n  Strong vs Infantry, Light armor, Aircraft\n  Weak vs Tanks
	Valued:
		Cost: 2500
	Tooltip:
		Name: Dragon
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	RenderSprites:
		Image: mdragon
	Health:
		HP: 13000
	Armament@PRIMARY:
		Name: primary
		Weapon: DragonGround
		RequiresCondition: !lowpower
		PauseOnCondition: !ammo
	Armament@SECONDARY:
		Name: secondary
		Weapon: DragonAir
		RequiresCondition: !lowpower
	AttackAircraft:
		Armaments: primary, secondary
		FacingTolerance: 512
		PersistentTargeting: True
	Aircraft:
		TurnSpeed: 15
		Speed: 130
		CruiseAltitude: 1280
		VTOL: true
		CanHover: true
		LandableTerrainTypes: Clear, ClearSnow, Rough, Road, Ore, Beach, Gems, Creep, Tiberium, BlueTiberium
	RevealsShroud:
		MinRange: 6c0
		Range: 11c0
		MoveRecalculationThreshold: 0
		Type: GroundPosition
		RevealGeneratedShroud: False
	AutoTarget:
		InitialStance: AttackAnything
		InitialStanceAI: AttackAnything
	AmmoPool:
		Armaments: primary
		Ammo: 10
		ReloadDelay: 1
		AmmoCondition: ammo
	RevealsShroud@GAPGEN:
		Range: 11c0
		MoveRecalculationThreshold: 0
		Type: GroundPosition
	Selectable:
		Bounds: 1536, 1194, 0, 85
		DecorationBounds: 1706, 1237, 0, 42
	SelectionDecorations:
	ProducibleWithLevel:
		Prerequisites: aircraft.upgraded
	SpawnActorOnDeath:
		Actor: MediDragon.Husk
	Rearmable:
	WithAmmoPipsDecoration:
		Position: BottomLeft
		RequiresSelection: true
		PipCount: 6
	-EjectOnDeath:

