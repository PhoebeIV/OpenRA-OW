name: Full Release

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: Create a GitHub Release from the built files 
        type: boolean
        required: false
        default: true
permissions:
  contents: write  #  to fetch code and create GitHub Releases

jobs:
  release:
    name: Build All Platforms
    runs-on: ubuntu-22.04
    steps:
      - name: Clone Repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install Packaging Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zip desktop-file-utils

      - name: Build Full Release
        run: bash ./make-full-release.sh

      - name: Upload Release Files
        uses: actions/upload-artifact@v4
        with:
          name: openra-ow-full-release
          path: release/*
          if-no-files-found: error
      - name: Create GitHub Release
        if: inputs.create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(cat release/version.txt)"
          cat > release-notes.md <<EOF
          ## OpenRA-OW $version

          - macOS aarch64: arm64 zip
          - Windows: x64 zip
          - Linux: AppImage

          Note for macOS: there is currently no plan to release an x86 version of the program for macOS.

          ---For server---
          Linux server can be run via ./launch-server.sh from the extracted AppDir.
          The Windows and macOS zips include OpenRA.Server too (with their own launch-server.bat/.command).
          A server.conf is included with all of the settings you need to run the server.
          EOF

          gh release create "v$version" \
            release/OpenRA-OW-"$version"-linux-x86_64.AppImage \
            release/OpenRA-OW-"$version"-windows-x64.zip \
            release/OpenRA-OW-"$version"-macos-arm64.zip \
            --title "OpenRA-OW $version" \
            --notes-file release-notes.md